---
# Zabbix proxy living inside the k3s cluster. Used to monitor in-cluster
# Services (apt-cache, registry-cache*, etc.) without exposing them to the
# LAN. Active proxy mode — it dials the Zabbix server on 10051 and pulls
# config; nothing else needs to reach this pod from outside.
#
# emptyDir buffer + initContainer that creates the db_data subdir: the
# Zabbix entrypoint doesn't mkdir its sqlite parent (Z3002 cannot create
# database) when the volume is fresh, so we do it ourselves before the
# main container starts. strategy: Recreate because sqlite is single-writer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zproxy-k3s
  namespace: monitoring
  labels:
    app: zproxy-k3s
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zproxy-k3s
  template:
    metadata:
      labels:
        app: zproxy-k3s
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1997
        runAsGroup: 1995
        fsGroup: 1995
      initContainers:
        - name: init-data
          image: busybox:1.37
          command:
            - sh
            - -c
            - mkdir -p /var/lib/zabbix/db_data /var/lib/zabbix/snmptraps && chown -R 1997:1995 /var/lib/zabbix && chmod -R u+rwX /var/lib/zabbix
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/zabbix
      containers:
        - name: zabbix-proxy
          image: zabbix/zabbix-proxy-sqlite3:7.0-alpine-latest
          ports:
            - containerPort: 10051
              name: zbx-proxy
              protocol: TCP
          env:
            - name: ZBX_HOSTNAME
              value: zproxy-k3s.k3s.majowka.me
            - name: ZBX_SERVER_HOST
              value: zabbix.majowka.me
            - name: ZBX_SERVER_PORT
              value: "10051"
            - name: ZBX_PROXYMODE
              value: "0"
            - name: ZBX_CACHESIZE
              value: 64M
            - name: ZBX_HISTORYCACHESIZE
              value: 64M
            - name: ZBX_HISTORYINDEXCACHESIZE
              value: 16M
            - name: ZBX_CONFIGFREQUENCY
              value: "60"
            - name: ZBX_DATASENDERFREQUENCY
              value: "1"
            - name: ZBX_HEARTBEATFREQUENCY
              value: "60"
            - name: ZBX_LOGREMOTECOMMANDS
              value: "0"
            - name: ZBX_DEBUGLEVEL
              value: "3"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/zabbix
          livenessProbe:
            tcpSocket:
              port: 10051
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 10051
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: zproxy-k3s
  namespace: monitoring
  labels:
    app: zproxy-k3s
spec:
  type: ClusterIP
  selector:
    app: zproxy-k3s
  ports:
    - name: zbx-proxy
      port: 10051
      targetPort: 10051
      protocol: TCP
