      initContainers:
        - name: init-data
          image: busybox:1.38
          command:
            - sh
            - -c
            - mkdir -p /var/lib/zabbix/db_data /var/lib/zabbix/snmptraps && chown -R 1997:1995 /var/lib/zabbix && chmod -R u+rwX /var/lib/zabbix
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/zabbix
      containers:
        - name: zabbix-proxy
          image: zabbix/zabbix-proxy-sqlite3:7.0-alpine-latest
          ports:
            - containerPort: 10051
              name: zbx-proxy
              protocol: TCP
          env:
            - name: ZBX_HOSTNAME
              value: "zproxy-k3s-1"
            - name: ZBX_SERVER_HOST
              value: zabbix.majowka.me
