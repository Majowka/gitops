            - name: ZBX_CACHESIZE
              value: 64M
            - name: ZBX_HISTORYCACHESIZE
              value: 64M
            - name: ZBX_HISTORYINDEXCACHESIZE
              value: 16M
            - name: ZBX_CONFIGFREQUENCY
              value: "60"
            - name: ZBX_DATASENDERFREQUENCY
              value: "1"
            - name: ZBX_HEARTBEATFREQUENCY
              value: "60"
            - name: ZBX_LOGREMOTECOMMANDS
              value: "0"
            - name: ZBX_DEBUGLEVEL
              value: "3"
          resources:
            requests:
