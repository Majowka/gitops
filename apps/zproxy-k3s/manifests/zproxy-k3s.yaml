---
# Zabbix proxy HA inside the k3s cluster. Used to monitor in-cluster
# Services (apt-cache, registry-cache*, etc.) without exposing them to the
# LAN. Active proxy mode — each pod dials the Zabbix server on 10051 and
# pulls config; nothing reaches these pods from outside.
#
# HA via Zabbix 7.0 Proxy Group (K3S-ProxyGroup): 2 pods, each registered
# as a distinct proxy (zproxy-k3s-0 / zproxy-k3s-1). The server distributes
# monitored hosts across the live members and reassigns them on failure.
# The proxy group + per-proxy registration is done by the Ansible role
# zabbix_proxy_k3s — the proxies MUST exist server-side before the pods
# connect, otherwise the server rejects the unknown proxy.
#
# Architecture: 2× Deployment (one per logical proxy) instead of one
# StatefulSet. Each Deployment is replicas=1, ZBX_HOSTNAME is set as a
# hardcoded env value matching the Deployment name. Rationale:
#
# - StatefulSet sticky identity blocks self-healing when a worker node
#   becomes Unreachable: the pod stays "Terminating" forever because the
#   dead kubelet never acknowledges termination, and StatefulSet refuses
#   to create a replacement with the same ordinal until the old one is
#   fully gone. Observed in production 2026-05-28: zproxy-k3s-0 stuck
#   Terminating ~16h after AZPL Spot eviction of k3s-worker9.
#
# - Deployments don't share that constraint. When a pod is unreachable
#   for tolerationSeconds (30s here, default 300s), the controller marks
#   it for deletion and the ReplicaSet schedules a replacement on any
#   healthy node immediately. No "stuck Terminating" wait.
#
# - ProxyBufferMode=memory means proxies have no useful persistent state
#   (sqlite holds only server-synced config, refreshed on startup), so
#   identity stickiness isn't required for correctness — only the proxy
#   name needs to stay stable, and that is achieved here via the
#   Deployment template's hardcoded ZBX_HOSTNAME.
#
# - strategy: Recreate forbids the default RollingUpdate behaviour where
#   K8s would briefly run two pods with the same ZBX_HOSTNAME during a
#   rollout — the Zabbix server rejects a second connection from the
#   same proxy name.
#
# - podAntiAffinity on shared label app=zproxy-k3s keeps the two pods on
#   separate nodes regardless of which Deployment owns them, so a single
#   node failure can never take out the whole proxy group.
#
# Volume architecture (aligned with upstream zabbix-docker reference, gh#140):
#
# Previously a single emptyDir was mounted at /var/lib/zabbix, shadowing
# every subdirectory the image creates at build time. This required an
# init-data container to recreate lost dirs and was fragile against upstream
# entrypoint changes (any new subdir = crashloop until init-data was updated).
#
# Now: three targeted mounts on the specific subdirs that must be writable.
# All other image-provided paths (/var/lib/zabbix/ssl/certs, ssl/keys,
# ssl/ssl_ca, enc, ssh_keys, mibs, …) remain intact from the image layer —
# no init container needed.
#
#   db-data        emptyDir → /var/lib/zabbix/db_data
#     SQLite DB (ProxyBufferMode=memory: only server-synced config, ~zero
#     write pressure, ephemeral is fine, re-syncs on pod start).
#
#   snmptraps      emptyDir → /var/lib/zabbix/snmptraps
#     Written by snmptrapd sidecar (not deployed here), kept for entrypoint
#     compat. Ephemeral, not useful without snmptrapd.
#
#   ssl-ca-internal  emptyDir(medium:Memory) → /var/lib/zabbix/ssl/ssl_ca_internal
#     Written by openssl_prepare_ca() on every boot (upstream 5042789a,
#     2026-09-15): does rm -rf + cp -a from ssl_ca on each start, so the
#     target dir must be writable and is inherently ephemeral. Upstream
#     uses tmpfs for this; emptyDir{medium:Memory} is the k8s equivalent.
#     We don't use custom CA web scenarios (httptest.get → []) so this dir
#     is always empty in practice — it just needs to exist and be writable.
#
# fsGroup:1995 causes kubelet to chown all emptyDir volumes to gid 1995
# with g+rwX before any container runs, so the non-root user 1997:1995
# can write without CAP_CHOWN or root.

# Service per proxy instance. Used as the proxy's local_address in the
# proxy group registration (Ansible role zabbix_proxy_k3s) — even for
# active proxies the server may direct hosts via local_address in some
# failover paths. Per-instance ClusterIP gives a stable DNS that survives
# pod replacement on any node.
apiVersion: v1
kind: Service
metadata:
  name: zproxy-k3s-0
  namespace: monitoring
  labels:
    app: zproxy-k3s
    instance: "0"
spec:
  selector:
    app: zproxy-k3s
    instance: "0"
  ports:
    - name: zbx-proxy
      port: 10051
      targetPort: 10051
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: zproxy-k3s-1
  namespace: monitoring
  labels:
    app: zproxy-k3s
    instance: "1"
spec:
  selector:
    app: zproxy-k3s
    instance: "1"
  ports:
    - name: zbx-proxy
      port: 10051
      targetPort: 10051
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zproxy-k3s-0
  namespace: monitoring
  labels:
    app: zproxy-k3s
    instance: "0"
spec:
  replicas: 1
  strategy:
    # Recreate: stop the old pod before starting the new one. Default
    # RollingUpdate would briefly run two pods with the same
    # ZBX_HOSTNAME and the Zabbix server would reject the duplicate
    # connection.
    type: Recreate
  selector:
    matchLabels:
      app: zproxy-k3s
      instance: "0"
  template:
    metadata:
      labels:
        app: zproxy-k3s
        instance: "0"
    spec:
      # The proxy doesn't need Kubernetes API access; disable service-account
      # token automounting so a compromised container can't use the credential.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1997
        runAsGroup: 1995
        # fsGroup causes kubelet to chown all emptyDir volumes to gid 1995
        # with g+rwX before any container runs. No init container needed.
        fsGroup: 1995
      # Hard anti-affinity by the shared app label keeps the two proxy
      # pods on separate nodes regardless of which Deployment owns them.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: zproxy-k3s
              topologyKey: kubernetes.io/hostname
      # Aggressive eviction from unreachable / not-ready nodes (30s vs
      # the default 300s). Critical for HA: a Spot eviction takes a
      # worker out of the cluster almost instantly, and we want the
      # pod re-scheduled on a healthy node within ~1 minute rather
      # than waiting 5+ for the default node-lifecycle timeout.
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      containers:
        - name: zabbix-proxy
          # Pinned to the post-2026-09-15 digest (the build that introduced
          # openssl_prepare_ca in the entrypoint — gh#140). Both replicas must
          # run the same digest so registry-side updates can't silently diverge
          # their behaviour again. Update intentionally via PR when upgrading.
          # Tag kept for human readability; digest is what Kubernetes actually uses.
          image: zabbix/zabbix-proxy-sqlite3:7.0-alpine-latest@sha256:af920211d4a57ea2e04e867eabd8899cbc7b3c641b86fb84fcd458207c3c50cd
          ports:
            - containerPort: 10051
              name: zbx-proxy
              protocol: TCP
          env:
            # Proxy name hardcoded per Deployment. Must match the proxy
            # registered server-side by the Ansible role zabbix_proxy_k3s,
            # else the server rejects the connection.
            - name: ZBX_HOSTNAME
              value: "zproxy-k3s-0"
            - name: ZBX_SERVER_HOST
              value: zabbix.majowka.me
            - name: ZBX_SERVER_PORT
              value: "10051"
            - name: ZBX_PROXYMODE
              value: "0"
            - name: ZBX_PROXYBUFFERMODE
              value: memory
            - name: ZBX_PROXYMEMORYBUFFERSIZE
              value: 96M
            - name: ZBX_CACHESIZE
              value: 64M
            - name: ZBX_HISTORYCACHESIZE
              value: 64M
            - name: ZBX_HISTORYINDEXCACHESIZE
              value: 16M
            - name: ZBX_CONFIGFREQUENCY
              value: "60"
            - name: ZBX_DATASENDERFREQUENCY
              value: "1"
            - name: ZBX_HEARTBEATFREQUENCY
              value: "60"
            - name: ZBX_LOGREMOTECOMMANDS
              value: "0"
            - name: ZBX_DEBUGLEVEL
              value: "2"
          resources:
            requests:
              cpu: 50m
              memory: 352Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/zabbix/db_data
            - name: snmptraps
              mountPath: /var/lib/zabbix/snmptraps
            - name: ssl-ca-internal
              mountPath: /var/lib/zabbix/ssl/ssl_ca_internal
          livenessProbe:
            tcpSocket:
              port: 10051
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 10051
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        # SQLite DB — ephemeral, re-syncs from server on pod start.
        - name: db-data
          emptyDir:
            sizeLimit: 256Mi
        # snmptraps writer socket — not actively used (no snmptrapd sidecar),
        # kept for entrypoint compatibility.
        - name: snmptraps
          emptyDir:
            sizeLimit: 64Mi
        # openssl_prepare_ca() writes here on every boot (rm -rf + cp -a).
        # Must be writable and is inherently ephemeral → Memory-backed emptyDir
        # (equivalent to upstream's tmpfs mount for this path).
        - name: ssl-ca-internal
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zproxy-k3s-1
  namespace: monitoring
  labels:
    app: zproxy-k3s
    instance: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zproxy-k3s
      instance: "1"
  template:
    metadata:
      labels:
        app: zproxy-k3s
        instance: "1"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1997
        runAsGroup: 1995
        fsGroup: 1995
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: zproxy-k3s
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      containers:
        - name: zabbix-proxy
          # Pinned to the post-2026-09-15 digest (the build that introduced
          # openssl_prepare_ca in the entrypoint — gh#140). Both replicas must
          # run the same digest so registry-side updates can't silently diverge
          # their behaviour again. Update intentionally via PR when upgrading.
          # Tag kept for human readability; digest is what Kubernetes actually uses.
          image: zabbix/zabbix-proxy-sqlite3:7.0-alpine-latest@sha256:af920211d4a57ea2e04e867eabd8899cbc7b3c641b86fb84fcd458207c3c50cd
          ports:
            - containerPort: 10051
              name: zbx-proxy
              protocol: TCP
          env:
            - name: ZBX_HOSTNAME
              value: "zproxy-k3s-1"
            - name: ZBX_SERVER_HOST
              value: zabbix.majowka.me
            - name: ZBX_SERVER_PORT
              value: "10051"
            - name: ZBX_PROXYMODE
              value: "0"
            - name: ZBX_PROXYBUFFERMODE
              value: memory
            - name: ZBX_PROXYMEMORYBUFFERSIZE
              value: 96M
            - name: ZBX_CACHESIZE
              value: 64M
            - name: ZBX_HISTORYCACHESIZE
              value: 64M
            - name: ZBX_HISTORYINDEXCACHESIZE
              value: 16M
            - name: ZBX_CONFIGFREQUENCY
              value: "60"
            - name: ZBX_DATASENDERFREQUENCY
              value: "1"
            - name: ZBX_HEARTBEATFREQUENCY
              value: "60"
            - name: ZBX_LOGREMOTECOMMANDS
              value: "0"
            - name: ZBX_DEBUGLEVEL
              value: "2"
          resources:
            requests:
              cpu: 50m
              memory: 352Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/zabbix/db_data
            - name: snmptraps
              mountPath: /var/lib/zabbix/snmptraps
            - name: ssl-ca-internal
              mountPath: /var/lib/zabbix/ssl/ssl_ca_internal
          livenessProbe:
            tcpSocket:
              port: 10051
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 10051
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: db-data
          emptyDir:
            sizeLimit: 256Mi
        - name: snmptraps
          emptyDir:
            sizeLimit: 64Mi
        - name: ssl-ca-internal
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
# Utrzymuje min. 1 proxy w górze podczas dobrowolnych zakłóceń (drain
# węzła). Selektor `app: zproxy-k3s` dopasowuje pody z obu Deploymentów,
# więc minAvailable=1 zapewnia że nigdy nie stracimy obu jednocześnie
# przy planned maintenance. PodAntiAffinity wymusza by były na osobnych
# nodach, więc drain pojedynczego node zawsze może wytrącić co najwyżej
# jednego z dwóch.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zproxy-k3s
  namespace: monitoring
  labels:
    app: zproxy-k3s
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: zproxy-k3s
