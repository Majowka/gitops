---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: "1.13.1"
    helm:
      releaseName: alloy
      valuesObject:
        # Secret `grafana-cloud-alloy` (LOKI_URL, LOKI_USER, ALLOY_TOKEN) is created
        # out-of-band from Infisical infra-platform/prod:/platform/grafana-cloud
        # (repo is public, no secrets in git).
        controller:
          type: daemonset
        alloy:
          clustering:
            enabled: false
          extraEnv:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: LOKI_URL
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-alloy
                  key: LOKI_URL
            - name: LOKI_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-alloy
                  key: LOKI_USER
            - name: ALLOY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-alloy
                  key: ALLOY_TOKEN
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 256Mi
          configMap:
            content: |
              // Pod logs of the pods scheduled on this node, via the Kubernetes API.
              discovery.kubernetes "pods" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + sys.env("NODE_NAME")
                }
              }

              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "node"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
                  separator     = ";"
                  regex         = "([^;]+);.*|;([^;]+)"
                  replacement   = "$1$2"
                  target_label  = "app"
                }
              }

              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pods.output
                forward_to = [loki.write.grafana_cloud.receiver]
              }

              loki.write "grafana_cloud" {
                external_labels = {
                  cluster = "k3s",
                }
                endpoint {
                  url = sys.env("LOKI_URL") + "/loki/api/v1/push"
                  basic_auth {
                    username = sys.env("LOKI_USER")
                    password = sys.env("ALLOY_TOKEN")
                  }
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
