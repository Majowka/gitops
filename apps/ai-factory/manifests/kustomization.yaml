# AI Software Factory (Majowka/ai-software-factory): Tekton pipelines that turn GitHub issues and comments into
# pull requests, with OpenCode (OpenCode Go) and Claude Code as agent engines. Needs apps/tekton.
# Bump: change the ref of both remote bases together; the agent image tag is the commit SHA built by the
# agent-image workflow of that repo (only commits that touch agents/Dockerfile produce a new image).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-factory
resources:
  - namespace.yaml
  - serviceaccount-pipeline.yaml
  - https://github.com/Majowka/ai-software-factory//agents?ref=895423b72e018ec9f2c30f607e0fa1036f8ddf62
  - https://github.com/Majowka/ai-software-factory//tekton?ref=895423b72e018ec9f2c30f607e0fa1036f8ddf62
  - cloudflared.yaml
images:
  - name: ghcr.io/majowka/factory-agent
    newTag: ddd14f83f29f21387fd1301472a4908fcc8114d8
configurations:
  - tekton-images.yaml
patches:
  # Requirements scan: hourly, only for issues labeled `requirements` in the repositories below. The `test` ops make
  # the patch fail (instead of patching the wrong variable) if the env order in the base CronJob changes.
  # MAX_OPEN 2: at most two open task issues per requirements issue, to keep the cluster load low.
  - target:
      kind: CronJob
      name: requirements-scan
    patch: |-
      - op: add
        path: /spec/suspend
        value: false
      - op: test
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/3/name
        value: REPOS
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/3/value
        value: Majowka/mesh-manager
      - op: test
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/4/name
        value: MAX_OPEN
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/4/value
        value: "2"
  # Run pruner: ~13 runs/h with a 10Gi local-path work volume each on 38G root disks; with 3 h retention the
  # workers went back to DiskPressure (2026-11-25), so finished runs (pods, logs, PVCs) go after 1 h, keeping 5.
  - target:
      kind: CronJob
      name: run-pruner
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: run-pruner
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: prune
                    env:
                      - name: RUN_KEEP_HOURS
                        value: "1"
                      - name: KEEP_LAST
                        value: "5"
  # The `pipeline` service account is defined here, not in the remote tekton base, so kustomize does not move the
  # subject of the base's RoleBinding llm-slots to this namespace (it stayed `agents` and every step got 403 on Leases).
  - target:
      kind: RoleBinding
      name: llm-slots
    patch: |-
      - op: test
        path: /subjects/0/name
        value: pipeline
      - op: replace
        path: /subjects/0/namespace
        value: ai-factory
