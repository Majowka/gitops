# GitHub webhook path: GitHub App -> Cloudflare Worker github-openbot-relay (route "factory", Majowka/infrastructure
# workers/github-openbot-relay/src/factory.js) -> Workers VPC Service ai-factory-el -> this tunnel -> el-new-issue:8080.
# Outbound only (QUIC, UDP 7844); the cluster has no public entry. Remotely managed tunnel k3s-ai-factory
# (a480012f-a287-402c-ac84-88016edc4dc2): the token is in
# Infisical (infra-k3s / vrtx-cluster, AI_FACTORY_CLOUDFLARED_TUNNEL_TOKEN) and in Secret cloudflared-tunnel (see ../README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  # Replicas are for availability only: cloudflared does not load balance between them.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      automountServiceAccountToken: false
      # The pod network runs over flannel on Tailscale (pod MTU 1230), too small for QUIC (Initial packets are 1280 B IP
      # with DF), and Workers VPC needs QUIC. On the host network QUIC uses the node's own interface.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        # One replica per node (host network: the metrics port is taken on the node).
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cloudflared
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.11.2
          args: ["tunnel", "--no-autoupdate", "--protocol", "quic", "--metrics", "127.0.0.1:20241", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel
                  key: token
          livenessProbe:
            httpGet:
              # Metrics listen on loopback only: Sysclay nodes have public addresses.
              host: 127.0.0.1
              path: /ready
              port: 20241
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
