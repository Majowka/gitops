---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-metrics-aks-burst
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: "1.13.1"
    helm:
      releaseName: alloy-metrics
      values: |
        # Secret `grafana-cloud-alloy-metrics` (PROM_URL = base URL without path, PROM_USER,
        # ALLOY_METRICS_TOKEN) is created out-of-band from Infisical
        # infra-platform/prod:/platform/grafana-cloud (repo is public, no secrets in git).
        controller:
          type: daemonset
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
            - key: kubernetes.azure.com/scalesetpriority
              operator: Equal
              value: spot
              effect: NoSchedule
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        configReloader:
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
        alloy:
          # Clustering spreads the cluster-wide scrape (kube-state-metrics) over the DaemonSet pods;
          # per-node scrapes (own kubelet) are not clustered.
          clustering:
            enabled: true
          extraEnv:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: PROM_URL
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-alloy-metrics
                  key: PROM_URL
            - name: PROM_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-alloy-metrics
                  key: PROM_USER
            - name: ALLOY_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-alloy-metrics
                  key: ALLOY_METRICS_TOKEN
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          configMap:
            content: |
              // Own node's kubelet (cAdvisor): container CPU/memory/network/OOM. Series are curated to
              // stay far below the Grafana Cloud free tier (10k active series).
              discovery.relabel "kubelet" {
                targets = [{ "__address__" = sys.env("NODE_IP") + ":10250", "node" = sys.env("NODE_NAME") }]
              }

              prometheus.scrape "cadvisor" {
                targets         = discovery.relabel.kubelet.output
                metrics_path    = "/metrics/cadvisor"
                scheme          = "https"
                bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                tls_config {
                  insecure_skip_verify = true
                }
                scrape_interval = "60s"
                scrape_timeout  = "30s"
                forward_to      = [prometheus.relabel.cadvisor.receiver]
              }

              prometheus.relabel "cadvisor" {
                rule {
                  source_labels = ["__name__"]
                  regex         = "container_cpu_usage_seconds_total|container_cpu_cfs_throttled_periods_total|container_cpu_cfs_periods_total|container_memory_working_set_bytes|container_memory_rss|container_oom_events_total|container_network_receive_bytes_total|container_network_transmit_bytes_total"
                  action        = "keep"
                }
                // pod-level series only: drop the cgroup roots and pause containers
                rule {
                  source_labels = ["container"]
                  regex         = ""
                  action        = "drop"
                }
                rule {
                  source_labels = ["container"]
                  regex         = "POD"
                  action        = "drop"
                }
                rule {
                  regex  = "id|name|image"
                  action = "labeldrop"
                }
                forward_to = [prometheus.remote_write.grafana_cloud.receiver]
              }

              // Own kubelet process metrics (running pods/containers, volume stats).
              prometheus.scrape "kubelet" {
                targets         = discovery.relabel.kubelet.output
                metrics_path    = "/metrics"
                scheme          = "https"
                bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                tls_config {
                  insecure_skip_verify = true
                }
                scrape_interval = "60s"
                scrape_timeout  = "30s"
                forward_to      = [prometheus.relabel.kubelet.receiver]
              }

              prometheus.relabel "kubelet" {
                rule {
                  source_labels = ["__name__"]
                  regex         = "kubelet_running_pods|kubelet_running_containers|kubelet_node_name|kubelet_volume_stats_used_bytes|kubelet_volume_stats_capacity_bytes|kubelet_pod_start_duration_seconds_count|kubelet_pod_start_duration_seconds_sum"
                  action        = "keep"
                }
                forward_to = [prometheus.remote_write.grafana_cloud.receiver]
              }

              // kube-state-metrics: restarts, last termination reason (OOMKilled), phases, replicas, node conditions.
              discovery.kubernetes "ksm" {
                role = "endpoints"
                namespaces {
                  names = ["monitoring"]
                }
                selectors {
                  role  = "endpoints"
                  label = "app.kubernetes.io/name=kube-state-metrics"
                }
              }

              prometheus.scrape "ksm" {
                targets         = discovery.kubernetes.ksm.targets
                scrape_interval = "60s"
                honor_labels    = true
                clustering {
                  enabled = true
                }
                forward_to = [prometheus.relabel.ksm.receiver]
              }

              prometheus.relabel "ksm" {
                rule {
                  source_labels = ["__name__"]
                  regex         = "kube_pod_status_phase|kube_pod_container_status_restarts_total|kube_pod_container_status_last_terminated_reason|kube_pod_container_status_waiting_reason|kube_pod_container_status_ready|kube_pod_info|kube_pod_container_resource_requests|kube_pod_container_resource_limits|kube_deployment_spec_replicas|kube_deployment_status_replicas_available|kube_daemonset_status_desired_number_scheduled|kube_daemonset_status_number_available|kube_statefulset_replicas|kube_statefulset_status_replicas_ready|kube_node_status_condition|kube_node_spec_unschedulable|kube_node_status_allocatable|kube_node_status_capacity|kube_persistentvolumeclaim_status_phase"
                  action        = "keep"
                }
                // kube_pod_status_phase has one series per phase; keep only the active (value 1) ones' worth by dropping noise labels
                rule {
                  regex  = "instance|pod_ip|host_ip|uid|created_by_name|created_by_kind|host_network|priority_class"
                  action = "labeldrop"
                }
                forward_to = [prometheus.remote_write.grafana_cloud.receiver]
              }

              prometheus.remote_write "grafana_cloud" {
                external_labels = {
                  cluster = "aks-burst",
                }
                endpoint {
                  url = sys.env("PROM_URL") + "/api/prom/push"
                  basic_auth {
                    username = sys.env("PROM_USER")
                    password = sys.env("ALLOY_METRICS_TOKEN")
                  }
                }
              }
  destination:
    server: https://aks-azpl-burst-q0b1219v.hcp.polandcentral.azmk8s.io:443
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
