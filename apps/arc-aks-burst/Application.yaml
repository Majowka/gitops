---
# ARC controller (gha-runner-scale-set-controller) for the AKS burst cluster
# (aks-azpl-burst, Azure Poland Central — provisioned by a separate tf-azure
# PR). AutoscalingRunnerSets require a controller running on the SAME
# cluster as the runner set (apps/arc-runner-set-org-aks-burst) — it is not
# optional, see docs/plans/arc-multi-cluster-ha.md in Majowka/infrastructure
# ("ARC (gha-runner-scale-set-controller) zainstalowany na drugim klastrze
# ... nie jest opcjonalne"). Mirrors apps/arc/Application.yaml (the on-prem
# k3s controller) 1:1, only destination and metadata.name differ.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-aks-burst
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set-controller
    targetRevision: "0.14.2"
    helm:
      values: |
        metrics:
          controllerManagerAddr: ":8080"
          listenerAddr: ":8080"
          listenerEndpoint: "/metrics"
  destination:
    # aks-azpl-burst registered 2026-09-30 via 'argocd cluster add
    # aks-azpl-burst --core --name aks-azpl-burst' (server
    # https://aks-azpl-burst-q0b1219v.hcp.polandcentral.azmk8s.io:443).
    name: aks-azpl-burst
    namespace: arc-systems
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # required: ARC CRDs exceed the 262144-byte
        # kubectl.kubernetes.io/last-applied-configuration limit under
        # client-side apply (confirmed live: SyncFailed on all 4 ARC CRDs
        # on aks-azpl-burst until this was added) — matches apps/arc
        # (on-prem), which already has this and was the actual 1:1 source
        # of truth this file should have copied in the first place.
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
