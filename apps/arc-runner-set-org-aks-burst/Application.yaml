---
# Elastic overflow AutoscalingRunnerSet for the AKS burst cluster
# (aks-azpl-burst, Azure Poland Central Spot nodes). Shares GitHub identity
# (githubConfigUrl/runnerGroup/scaleSetLabels) with apps/arc-runner-set-org
# (on-prem k3s) so both clusters' listeners pool jobs for
# `runs-on: [self-hosted, builder-org]` — see values.yaml for details and
# docs/plans/arc-multi-cluster-ha.md (Majowka/infrastructure) for the
# underlying GitHub HA mechanism this depends on.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runner-set-org-aks-burst
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: "0.14.2"
      helm:
        valueFiles:
          - $values/apps/arc-runner-set-org-aks-burst/values.yaml
    - repoURL: https://github.com/Majowka/gitops.git
      targetRevision: main
      ref: values
  destination:
    # TODO: replace once aks-azpl-burst is registered via
    # 'argocd cluster add' — see tf-azure PR (AKS cluster provisioning,
    # parallel to this PR). This Application will not reconcile until then.
    # Once registered, either set `name: aks-azpl-burst` (matching the name
    # given to `argocd cluster add`) or `server: <AKS apiserver URL>` — do
    # not invent a real-looking URL in the meantime.
    name: aks-azpl-burst # PLACEHOLDER — not yet a registered ArgoCD cluster
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Unlike arc-runner-set-org (CreateNamespace=false, namespace already
      # exists on the shared k3s cluster), arc-runners does not yet exist on
      # the new AKS cluster.
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
