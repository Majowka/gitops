---
# Elastic overflow AutoscalingRunnerSet for the AKS burst cluster
# (aks-azpl-burst, Azure Poland Central Spot nodes). Shares GitHub identity
# (githubConfigUrl/runnerGroup/scaleSetLabels) with apps/arc-runner-set-org
# (on-prem k3s) so both clusters' listeners pool jobs for
# `runs-on: [self-hosted, builder-org]` — see values.yaml for details and
# docs/plans/arc-multi-cluster-ha.md (Majowka/infrastructure) for the
# underlying GitHub HA mechanism this depends on.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runner-set-org-aks-burst
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: "0.14.2"
      helm:
        valueFiles:
          - $values/apps/arc-runner-set-org-aks-burst/values.yaml
    - repoURL: https://github.com/Majowka/gitops.git
      targetRevision: main
      ref: values
  destination:
    # aks-azpl-burst registered 2026-09-30 via 'argocd cluster add
    # aks-azpl-burst --core --name aks-azpl-burst' (server
    # https://aks-azpl-burst-q0b1219v.hcp.polandcentral.azmk8s.io:443).
    name: aks-azpl-burst
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Unlike arc-runner-set-org (CreateNamespace=false, namespace already
      # exists on the shared k3s cluster), arc-runners does not yet exist on
      # the new AKS cluster.
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
