apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: kamil-poc
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  limits:
    cpu: "4"
    memory: 8Gi
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
  template:
    metadata:
      labels:
        pool: kamil-poc
    spec:
      nodeClassRef:
        group: karpenter.proxmox.sinextra.dev
        kind: ProxmoxNodeClass
        name: kamil-poc
      taints:
        - key: pool
          value: kamil-poc
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.proxmox.sinextra.dev/instance-cpu
          operator: Lt
          values: ["3"]
