---
# Alias Service for the VRTX replica — kept so anything still referencing
# `registry-cache-mcr-vrtx` (e.g. arc_setup dind /etc/hosts override) keeps
# working without changes.
apiVersion: v1
kind: Service
metadata:
  name: registry-cache-mcr-vrtx
  namespace: arc-runners
spec:
  type: ClusterIP
  selector:
    app: registry-cache-mcr
  ports:
    - name: https
      port: 443
      targetPort: 5000
    - name: http
      port: 80
      targetPort: 5000
    - name: registry
      port: 5000
      targetPort: 5000
    - name: metrics
      port: 5001
      targetPort: 5001
---
# NodePort exposing the VRTX cache's metrics endpoint to Zabbix
# (VRTX-ProxyGroup scrapes the host network). Pre-zproxy-k3s legacy that's
# still scraped today — keep the NodePort number stable (30503).
apiVersion: v1
kind: Service
metadata:
  name: registry-cache-mcr-metrics
  namespace: arc-runners
spec:
  type: NodePort
  selector:
    app: registry-cache-mcr
  ports:
    - name: metrics
      port: 5001
      targetPort: 5001
      nodePort: 30503
---
# Same idea for the LDC cache — LDC-ProxyGroup scrapes NodePort 30513.
apiVersion: v1
kind: Service
metadata:
  name: registry-cache-mcr-ldc-metrics
  namespace: arc-runners
spec:
  type: NodePort
  selector:
    app: registry-cache-mcr-ldc
  ports:
    - name: metrics
      port: 5001
      targetPort: 5001
      nodePort: 30513
