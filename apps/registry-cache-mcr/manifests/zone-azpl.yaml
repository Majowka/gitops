---
# AZPL-local replica (Azure Poland Central) of registry-cache-mcr. Pulled by ARC runners scheduled
# on LDC nodes — without this they'd traverse Tailscale across DCs to hit
# the VRTX pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-cache-mcr-azpl
  namespace: arc-runners
  labels:
    app: registry-cache-mcr-azpl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry-cache-mcr-azpl
  template:
    metadata:
      labels:
        app: registry-cache-mcr-azpl
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["azpl"]
      containers:
        - name: registry
          # registry:3 verified on Docker Hub (digest sha256:6ad90ba0..., amd64/linux).
          # Digest-pinned for full reproducibility on this canary zone (azpl) per PR #20
          # review discussion. Tag registry:3 exists in library/registry (official image).
          # Non-azpl zones intentionally use mutable tag pending global rollout (PR #18).
          image: registry:3@sha256:6ad90ba0078c20cbdaa26b08aa2005a6ba409234f50f485d25eadd604704511e
          env:
            - name: REGISTRY_PROXY_REMOTEURL
              value: https://mcr.microsoft.com
            - name: REGISTRY_PROXY_TTL
              value: "24h"
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
            - name: REGISTRY_HTTP_ADDR
              value: :5000
            - name: REGISTRY_HTTP_DEBUG_ADDR
              value: :5001
            - name: REGISTRY_HTTP_DEBUG_PROMETHEUS_ENABLED
              value: "true"
            - name: REGISTRY_HTTP_DEBUG_PROMETHEUS_PATH
              value: /metrics
          ports:
            - containerPort: 5000
              name: registry
            - containerPort: 5001
              name: metrics
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
      volumes:
        - name: registry-data
          emptyDir:
            sizeLimit: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: registry-cache-mcr-azpl
  namespace: arc-runners
spec:
  type: ClusterIP
  selector:
    app: registry-cache-mcr-azpl
  ports:
    - name: https
      port: 443
      targetPort: 5000
    - name: http
      port: 80
      targetPort: 5000
    - name: registry
      port: 5000
      targetPort: 5000
    - name: metrics
      port: 5001
      targetPort: 5001
