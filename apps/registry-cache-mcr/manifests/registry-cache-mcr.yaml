---
# Pull-through cache for mcr.microsoft.com. Used by ARC runners for .NET /
# Microsoft container images. One pod, pinned to a VRTX node — per-DC
#
# gc sidecar: runs `registry garbage-collect` every hour to evict corrupted or
# zero-byte blobs before they cause CI failures (short read: unexpected EOF).
# topology (LDC fallback) lives in a separate Application that adds extra
# Services and node-labelers.
#
# Failure mode: dind has /etc/hosts override pointing at this Service with a
# health-check fallback to upstream, so a dead cache slows builds but doesn't
# break them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-cache-mcr
  namespace: arc-runners
  labels:
    app: registry-cache-mcr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry-cache-mcr
  template:
    metadata:
      labels:
        app: registry-cache-mcr
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["vrtx"]
      containers:
        - name: registry
          image: registry:3
          env:
            - name: REGISTRY_PROXY_REMOTEURL
              value: https://mcr.microsoft.com
            - name: REGISTRY_PROXY_TTL
              value: "24h"
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
            - name: REGISTRY_HTTP_ADDR
              value: :5000
            - name: REGISTRY_HTTP_DEBUG_ADDR
              value: :5001
            - name: REGISTRY_HTTP_DEBUG_PROMETHEUS_ENABLED
              value: "true"
            - name: REGISTRY_HTTP_DEBUG_PROMETHEUS_PATH
              value: /metrics
          ports:
            - containerPort: 5000
              name: registry
            - containerPort: 5001
              name: metrics
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
        - name: gc
          image: registry:3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -c
            - |
              sleep 60
              while true; do
                echo "[gc] starting garbage-collect at $(date -u)"
                if registry garbage-collect /etc/distribution/config.yml --delete-untagged=false; then
                  echo "[gc] done, sleeping 1h"
                  sleep 3600
                else
                  echo "[gc] gc failed, retrying in 60s" >&2
                  sleep 60
                fi
              done
          env:
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: registry-data
          emptyDir:
            sizeLimit: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: registry-cache-mcr
  namespace: arc-runners
spec:
  selector:
    app: registry-cache-mcr
  ports:
    - name: https
      port: 443
      targetPort: 5000
    - name: http
      port: 80
      targetPort: 5000
    - name: registry
      port: 5000
      targetPort: 5000
    - name: metrics
      port: 5001
      targetPort: 5001
  type: ClusterIP
