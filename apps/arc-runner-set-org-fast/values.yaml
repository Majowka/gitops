controllerServiceAccount:
  name: arc-gha-rs-controller
  namespace: arc-systems
githubConfigUrl: "https://github.com/majowka"
githubConfigSecret: "arc-github-secret-org"
runnerScaleSetName: "k3s-arc-org-fast"
scaleSetLabels:
  - self-hosted
  - builder-org-fast
minRunners: 2
maxRunners: 10
containerMode: {}
# Listener pod talks only to the GitHub API (external) and the k8s API
# (resolved via env vars, not DNS). Cluster DNS would only be a liability:
# any SERVFAIL on a search-domain expansion (e.g. *.tail07246.ts.net via
# Tailscale accept-dns=true) would stall listener startup. Use external DNS.
# nodeSelector ensures the listener lands on a node that can egress to
# api.github.com.
listenerTemplate:
  spec:
    dnsConfig:
      nameservers:
        - 8.8.8.8
        - 8.8.4.4
    dnsPolicy: None
    nodeSelector:
      internet-access: "true"
template:
  spec:
    serviceAccountName: arc-runner
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/part-of: gha-runner-scale-set
      - maxSkew: 3
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/part-of: gha-runner-scale-set
    terminationGracePeriodSeconds: 60
    containers:
      - name: runner
        image: ghcr.io/majowka/arc-runner:latest
        resources:
          requests:
            cpu: "500m"
            memory: "256Mi"
        env:
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            value: "false"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
    volumes:
      - name: work
        emptyDir: {}
