controllerServiceAccount:
  name: arc-gha-rs-controller
  namespace: arc-systems
githubConfigUrl: "https://github.com/majowka"
githubConfigSecret: "arc-github-secret-org"
runnerScaleSetName: "k3s-arc-org-fast"
scaleSetLabels:
  - self-hosted
  - builder-org-fast
minRunners: 2
maxRunners: 10
containerMode: {}
# Listener uses default ClusterFirst dnsPolicy so it resolves api.github.com
# through CoreDNS like every other pod — the SERVFAIL search-domain trap that
# previously required `dnsPolicy: None` was eliminated by ans_playbooks PR #81
# (worker `accept-dns=false` rollout). Single DNS egress through CoreDNS keeps
# the architecture consistent — the only pods that intentionally bypass
# CoreDNS are the registry/apt caches (they MUST hit real upstream, else they
# would resolve themselves via the worker /etc/hosts overrides and loop).
#
# CRD validation requires at least one container with a name; ARC controller
# fills in the image (matching its own version) when image is omitted.
#
# No nodeSelector: the listener must be schedulable on any zone. It was
# pinned to nodes labelled internet-access=true (VRTX-only) from the same
# 2026-05-26 DNS fix — when VRTX went down on 2026-07-24 all three listeners
# (this one, arc-runner-set, arc-runner-set-org) sat Pending for ~4.5h with
# zero capacity to schedule new runners, since only VRTX carried that label.
# All zones have direct internet egress (verified from a running runner pod
# on an LDC node), so the constraint was never load-bearing.
listenerTemplate:
  spec:
    containers:
      - name: listener
template:
  spec:
    serviceAccountName: arc-runner
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/part-of: gha-runner-scale-set
      - maxSkew: 3
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/part-of: gha-runner-scale-set
    terminationGracePeriodSeconds: 60
    containers:
      - name: runner
        image: ghcr.io/majowka/arc-runner:latest
        resources:
          requests:
            cpu: "500m"
            memory: "256Mi"
        env:
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            value: "false"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
    volumes:
      - name: work
        emptyDir: {}
