---
# Pull-through cache for Google's Docker Hub mirror (mirror.gcr.io). This is
# not a mirror for the separate gcr.io registry; real gcr.io pulls must bypass
# this cache. One pod, pinned to a VRTX node — per-DC
# topology (LDC fallback) lives in a separate Application that adds extra
# Services and node-labelers.
#
# Failure mode: dind has /etc/hosts override pointing at this Service with a
# health-check fallback to upstream, so a dead cache slows builds but doesn't
# break them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-cache-gcr
  namespace: arc-runners
  labels:
    app: registry-cache-gcr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry-cache-gcr
  template:
    metadata:
      labels:
        app: registry-cache-gcr
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["vrtx"]
      containers:
        - name: registry
          image: registry:3
          env:
            - name: REGISTRY_PROXY_REMOTEURL
              value: https://mirror.gcr.io
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
            - name: REGISTRY_HTTP_ADDR
              value: :5000
            - name: REGISTRY_HTTP_DEBUG_ADDR
              value: :5001
            - name: REGISTRY_HTTP_DEBUG_PROMETHEUS_ENABLED
              value: "true"
            - name: REGISTRY_HTTP_DEBUG_PROMETHEUS_PATH
              value: /metrics
          ports:
            - containerPort: 5000
              name: registry
            - containerPort: 5001
              name: metrics
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
        - name: orphan-cleaner
          image: busybox
          command:
            - sh
            - -c
            - |
              clean() {
                find /var/lib/registry/docker/registry/v2/repositories/ \
                  -path '*/_layers/sha256/*/link' 2>/dev/null | \
                while read link; do
                  digest=$(basename $(dirname "$link"))
                  prefix=${digest:0:2}
                  data="/var/lib/registry/docker/registry/v2/blobs/sha256/${prefix}/${digest}/data"
                  if [ ! -f "$data" ]; then
                    repo=$(echo "$link" | sed 's|.*/repositories/||;s|/_layers.*||')
                    echo "$(date -u +%FT%TZ) orphan-cleaner: removed ${repo}@${digest}"
                    rm -f "$link"
                  fi
                done
              }
              clean
              while true; do
                sleep 300
                clean
              done
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
      volumes:
        - name: registry-data
          emptyDir:
            sizeLimit: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: registry-cache-gcr
  namespace: arc-runners
spec:
  selector:
    app: registry-cache-gcr
  ports:
    - name: https
      port: 443
      targetPort: 5000
    - name: http
      port: 80
      targetPort: 5000
    - name: registry
      port: 5000
      targetPort: 5000
    - name: metrics
      port: 5001
      targetPort: 5001
  type: ClusterIP
