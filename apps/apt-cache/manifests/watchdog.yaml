---
# apt-cache-watchdog: toggles CoreDNS rewrite rules based on per-zone cache health.
#
# Logic:
#   all 3 zones have ready endpoints → apt-cache.override = 9 rewrite rules
#                                      trafficDistribution: PreferClose routes
#                                      runners to local-zone cache, no cross-VPN
#   any zone has 0 ready endpoints   → apt-cache.override = ""
#                                      apt hostnames resolve to real internet IPs
#                                      → direct internet, no cross-zone VPN fallback
#
# Debounce: zone must have 0 ready endpoints for 2 consecutive checks (~30s)
# before the rewrite is disabled, to avoid flapping on brief pod restarts.
#
# coredns-custom ConfigMap is patched in kube-system directly.
# ArgoCD does NOT manage that ConfigMap (not in this Application scope),
# so selfHeal will not revert watchdog changes.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apt-cache-watchdog
  namespace: arc-runners
---
# EndpointSlice reads scoped to arc-runners namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: apt-cache-watchdog
  namespace: arc-runners
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: apt-cache-watchdog
  namespace: arc-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: apt-cache-watchdog
subjects:
  - kind: ServiceAccount
    name: apt-cache-watchdog
    namespace: arc-runners
---
# Scoped to kube-system only — Role (not ClusterRole) avoids cluster-wide create
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: apt-cache-watchdog-coredns
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["coredns-custom"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]  # resourceNames cannot restrict create verb, but scope is kube-system only
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: apt-cache-watchdog-coredns
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: apt-cache-watchdog-coredns
subjects:
  - kind: ServiceAccount
    name: apt-cache-watchdog
    namespace: arc-runners
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apt-cache-watchdog-script
  namespace: arc-runners
data:
  watchdog.sh: |
    #!/bin/sh
    set -eu

    NS="arc-runners"
    CM_NS="kube-system"
    CM="coredns-custom"
    ZONES="vrtx ldc azpl"
    INTERVAL=15
    DEBOUNCE=2

    # Single-line JSON string value: \n = JSON newline escape, each rule on its own line.
    # Must stay in sync with nginx host→upstream map in apt-cache-config ConfigMap.
    RULES="rewrite name exact archive.ubuntu.com      apt-cache.arc-runners.svc.cluster.local\nrewrite name exact security.ubuntu.com     apt-cache.arc-runners.svc.cluster.local\nrewrite name exact ports.ubuntu.com        apt-cache.arc-runners.svc.cluster.local\nrewrite name exact ubuntu.task.gda.pl      apt-cache.arc-runners.svc.cluster.local\nrewrite name exact ftp.task.gda.pl         apt-cache.arc-runners.svc.cluster.local\nrewrite name exact ftp.man.poznan.pl       apt-cache.arc-runners.svc.cluster.local\nrewrite name exact ftp.icm.edu.pl          apt-cache.arc-runners.svc.cluster.local\nrewrite name exact deb.debian.org          apt-cache.arc-runners.svc.cluster.local\nrewrite name exact security.debian.org     apt-cache.arc-runners.svc.cluster.local"

    ready_count() {
      # awk always exits 0 and prints a single integer — avoids grep -c exiting non-zero
      # on zero matches (which caused || echo 0 to emit "0 0", breaking numeric comparison)
      kubectl get endpointslice -n "$NS" \
        -l "kubernetes.io/service-name=apt-cache-${1}" \
        -o jsonpath='{range .items[*]}{range .endpoints[*]}{.conditions.ready}{"\n"}{end}{end}' \
        2>/dev/null | awk '$0=="true"{c++} END{print c+0}'
    }

    patch_cm() {
      value=$1
      if ! kubectl get configmap "$CM" -n "$CM_NS" >/dev/null 2>&1; then
        echo "$(date -u +%FT%TZ) coredns-custom not found, creating"
        # Create an empty ConfigMap first, then fall through to the JSON patch below.
        # --from-literal stores literal \n characters, but the JSON patch path
        # interprets \n as real newlines. Always using the JSON patch path ensures
        # consistent data regardless of whether the ConfigMap pre-exists.
        kubectl create configmap "$CM" -n "$CM_NS"
      fi
      kubectl patch configmap "$CM" -n "$CM_NS" --type merge \
        --patch "{\"data\":{\"apt-cache.override\":\"${value}\",\"apt-cache.server\":\"\"}}"
    }

    fail_vrtx=0; fail_ldc=0; fail_azpl=0
    LAST=""

    echo "$(date -u +%FT%TZ) apt-cache-watchdog started (interval=${INTERVAL}s debounce=${DEBOUNCE})"

    while true; do
      for z in $ZONES; do
        n=$(ready_count "$z")
        case "$z" in
          vrtx) prev=$fail_vrtx ;;
          ldc)  prev=$fail_ldc ;;
          azpl) prev=$fail_azpl ;;
        esac
        if [ "$n" -gt 0 ]; then
          case "$z" in
            vrtx) fail_vrtx=0 ;;
            ldc)  fail_ldc=0 ;;
            azpl) fail_azpl=0 ;;
          esac
        else
          case "$z" in
            vrtx) fail_vrtx=$((prev + 1)) ;;
            ldc)  fail_ldc=$((prev + 1)) ;;
            azpl) fail_azpl=$((prev + 1)) ;;
          esac
        fi
      done

      desired="enabled"
      bad=""
      for z in $ZONES; do
        case "$z" in
          vrtx) fc=$fail_vrtx ;;
          ldc)  fc=$fail_ldc ;;
          azpl) fc=$fail_azpl ;;
        esac
        if [ "$fc" -ge "$DEBOUNCE" ]; then
          desired="disabled"
          bad="${bad} ${z}(${fc}x)"
        fi
      done

      if [ "$desired" != "$LAST" ]; then
        if [ "$desired" = "enabled" ]; then
          echo "$(date -u +%FT%TZ) all zones healthy → enabling CoreDNS rewrite"
          patch_cm "$RULES" && LAST="enabled" \
            || echo "$(date -u +%FT%TZ) ERROR: patch failed, retry next cycle"
        else
          echo "$(date -u +%FT%TZ) unhealthy:${bad} → disabling rewrite, apt → direct internet"
          patch_cm "" && LAST="disabled" \
            || echo "$(date -u +%FT%TZ) ERROR: patch failed, retry next cycle"
        fi
      fi

      sleep "$INTERVAL"
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apt-cache-watchdog
  namespace: arc-runners
  labels:
    app: apt-cache-watchdog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apt-cache-watchdog
  template:
    metadata:
      labels:
        app: apt-cache-watchdog
    spec:
      serviceAccountName: apt-cache-watchdog
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: watchdog
          image: bitnami/kubectl:latest
          command: ["/bin/sh", "/scripts/watchdog.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: HOME
              value: /tmp  # kubectl writes discovery cache to $HOME/.kube; /tmp is writable
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: apt-cache-watchdog-script
            defaultMode: 0755
        - name: tmp
          emptyDir: {}
